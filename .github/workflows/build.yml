name: Minarca-client

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

env:
  RELEASE_TAG: 7.2.0

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt -y --no-install-recommends install \
            build-essential debhelper dpkg-dev \
            librsync-dev libacl1-dev libattr1-dev \
            python3-dev python3-pip python3-venv \
            git xvfb xauth cron zenity kdialog desktop-file-utils

      - name: Clone minarca client
        run: |
          git clone https://gitlab.com/ikus-soft/minarca.git
          cd minarca
          git checkout ${{ env.RELEASE_TAG }}

      - name: Patch tests for CI without D-Bus
        run: |
          cd minarca
          sed -i "s|NO_DBUS = not os.environ.get('DBUS_SESSION_BUS_ADDRESS', False)|NO_DBUS = True|" \
            minarca_client/core/notification/tests/test_notification.py

      - name: Build Debian package
        run: |
          cd minarca
          export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MINARCA_CLIENT=${{ env.RELEASE_TAG }}
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../minarca-client_*_arm64.deb dist/minarca-client_${{ env.RELEASE_TAG }}_arm64.deb

      - name: Upload to GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: minarca-client_${{ env.RELEASE_TAG }}_arm64.deb
          path: minarca/dist/minarca-client_${{ env.RELEASE_TAG }}_arm64.deb

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
